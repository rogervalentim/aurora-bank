<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Bank · Estado da proposta de consignado</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1120px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }
    p.lede { font-size: 0.85rem; color: var(--color-muted); max-width: 68ch; margin-bottom: 1.5rem; line-height: 1.5; }
    .diagram { border: 1px solid rgba(45,49,66,0.10); border-radius: 8px; padding: 1rem; background: var(--color-paper); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Aurora Bank</p>
    <h1>Consignado: a margem de 35% é o portão</h1>
    <p class="lede">A proposta nasce do simulador e só vira contrato depois da decisão do analista. A margem é recalculada no servidor a cada transição — um pedido que estoure 35% da renda é recusado sem passar pelo humano.</p>

    <div class="diagram">
    <svg viewBox="30 140 1030 320" preserveAspectRatio="xMinYMin meet" style="width:100%; height:auto; aspect-ratio: 1030 / 320;" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="st-title st-desc">
      <title id="st-title">Máquina de estados da proposta de consignado</title>
      <desc id="st-desc">Proposta simulada passa por elegibilidade de margem, análise do analista, aprovação com crédito em saldo ou recusa.</desc>
      <defs>
        <marker id="tr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="tr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Start -->
      <circle cx="76" cy="252" r="6" fill="#2d3142"/>
      <text x="76" y="280" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">INÍCIO</text>

      <!-- Simulada -->
      <path d="M 84,252 H 130" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tr)"/>
      <rect x="132" y="220" width="156" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="210" y="246" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Simulada</text>
      <text x="210" y="262" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">parcela · CET</text>
      <text x="210" y="276" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">margem calculada</text>

      <!-- Simulada -> Em análise -->
      <path d="M 288,252 H 340" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tr)"/>
      <rect x="294" y="192" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="201" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">solicitar</text>

      <!-- Em análise -->
      <rect x="342" y="204" width="176" height="96" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="430" y="230" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Em análise</text>
      <text x="430" y="248" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">fila do backoffice</text>
      <text x="430" y="264" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">margem ≤ 35%</text>
      <text x="430" y="280" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">recalculada no servidor</text>

      <!-- Em análise -> Aprovada (accent) -->
      <path d="M 518,236 H 588" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#tr-accent)"/>
      <rect x="520" y="204" width="72" height="24" rx="2" fill="#f5f5f5"/>
      <text x="556" y="213" fill="#bf4520" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">aprovar</text>
      <text x="556" y="224" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">[margem ok]</text>

      <!-- Aprovada -->
      <rect x="590" y="204" width="176" height="64" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="678" y="230" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Aprovada</text>
      <text x="678" y="246" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">saldo creditado</text>
      <text x="678" y="260" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">extrato gravado</text>

      <!-- Aprovada -> Encerrada -->
      <path d="M 766,236 H 810" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tr)"/>
      <rect x="812" y="222" width="110" height="32" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="867" y="242" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Contratada</text>
      <circle cx="950" cy="238" r="7" fill="none" stroke="#2d3142" stroke-width="1.2"/>
      <circle cx="950" cy="238" r="3.4" fill="#2d3142"/>

      <!-- Em análise -> Recusada (erro) -->
      <path d="M 430,300 V 336 H 588" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#tr-accent)"/>
      <rect x="466" y="322" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="514" y="331" fill="#bf4520" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">recusar / margem</text>

      <!-- Recusada -->
      <rect x="590" y="308" width="176" height="56" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="678" y="332" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Recusada</text>
      <text x="678" y="348" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">nada é debitado</text>

      <!-- Recusada -> nova simulação (dashed) -->
      <path d="M 590,348 H 210 V 288" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#tr)"/>
      <rect x="352" y="342" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="396" y="351" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">nova simulação</text>

      <!-- Nota lateral -->
      <line x1="44" y1="404" x2="1040" y2="404" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="44" y="422" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Regra: parcela ≤ 35% da renda comprometida · prazo ∈ {12, 24, 36, 48, 60, 84} · taxa 1,65% a.m. · CET anual calculado</text>
      <text x="44" y="440" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">BUSINESS_RULES · packages/shared/src/constants.ts</text>
    </svg>
    </div>
  </div>
</body>
</html>
