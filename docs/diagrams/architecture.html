<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Bank · Arquitetura do monorepo</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1120px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }
    p.lede { font-size: 0.85rem; color: var(--color-muted); max-width: 62ch; margin-bottom: 1.5rem; line-height: 1.5; }
    .diagram { border: 1px solid rgba(45,49,66,0.10); border-radius: 8px; padding: 1rem; background: var(--color-paper); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Aurora Bank</p>
    <h1>Um núcleo de regras, dois clientes</h1>
    <p class="lede">O pacote <code>@aurora/shared</code> concentra tipos, schemas Zod e o cálculo financeiro. O backoffice e o app consomem a mesma API REST — nenhuma regra de margem é recalculada no cliente.</p>

    <div class="diagram">

      <title id="arch-title">Arquitetura do monorepo Aurora Bank</title>
      <desc id="arch-desc">Dois clientes (app Expo e backoffice Next.js) consomem a API REST, que usa o pacote compartilhado de regras e persiste contas, propostas e extrato.</desc>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: clientes -->
      <rect x="32" y="104" width="208" height="256" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="104" y="108" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="136" y="117" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLIENTES</text>

      <!-- Zone: backoffice -->
      <rect x="296" y="104" width="264" height="336" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="396" y="108" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="428" y="117" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NEXT.JS 15</text>

      <!-- Zone: shared -->
      <rect x="616" y="104" width="208" height="200" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="692" y="108" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="117" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SHARED</text>

      <!-- Zone: dados -->

      <text x="720" y="349" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DADOS</text>

      <!-- Arrows (behind nodes) -->
      <!-- App -> API -->
      <path d="M 208,184 H 330" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- Backoffice UI -> API routes -->
      <line x1="408" y1="208" x2="408" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- API -> shared -->
      <path d="M 536,320 H 640" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- API -> store -->
      <path d="M 536,344 H 580 Q 588,344 588,352 V 360 Q 588,368 596,368 V 376" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- App -> API (segunda chamada, abaixo) -->
      <path d="M 132,328 V 372 H 352 V 352" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="192" y="356" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="230" y="365" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DECISÃO KYC</text>

      <!-- Arrow labels -->
      <rect x="236" y="168" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="272" y="177" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JSON / REST</text>

      <rect x="414" y="224" width="40" height="12" rx="2" fill="#f5f5f5"/>

      <rect x="540" y="304" width="60" height="12" rx="2" fill="#f5f5f5"/>

      <rect x="548" y="330" width="68" height="12" rx="2" fill="#f5f5f5"/>

      <rect x="56" y="152" width="152" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>

      <text x="82" y="281" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HUMAN</text>
      <text x="132" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Analista</text>
      <text x="132" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">KYC · crédito</text>

      <!-- Node: UI backoffice -->
      <rect x="328" y="144" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

      <text x="408" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/login · /dashboard</text>

      <!-- Node: API routes -->
      <rect x="328" y="256" width="208" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="336" y="264" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="350" y="273" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="432" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Route handlers</text>
      <text x="432" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/api/accounts</text>
      <text x="432" y="322" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/api/pix · /api/loans</text>
      <text x="432" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/api/metrics</text>

      <!-- Node: shared -->
      <rect x="640" y="144" width="160" height="128" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <rect x="648" y="152" width="36" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
      <text x="666" y="161" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="720" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">@aurora/shared</text>
      <text x="720" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">schemas Zod · DTOs</text>
      <text x="720" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tabela Price · CET</text>
      <text x="720" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">margem 35% · CPF</text>
      <text x="720" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BRL · Pix</text>

      <!-- Node: store -->
      <rect x="640" y="376" width="160" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="720" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Contas · propostas</text>
      <text x="720" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sandbox · Firestore</text>

      <!-- Node: métricas (leitura) -->
      <rect x="848" y="248" width="192" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="856" y="256" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>

      <text x="944" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">KPI do dashboard</text>
      <text x="944" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fila · volume</text>

      <path d="M 536,288 H 928" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="700" y="272" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="728" y="281" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGGREGATE</text>

      <!-- Legend -->
      <g transform="translate(0, 60)">
        <line x1="32" y1="404" x2="1048" y2="404" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="32" y="422" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="32" y="434" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>

        <rect x="172" y="434" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

        <rect x="268" y="434" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>

        <rect x="344" y="434" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="364" y="442" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Ator</text>

        <line x1="416" y1="440" x2="444" y2="440" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="452" y="442" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP</text>

        <line x1="508" y1="440" x2="536" y2="440" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="544" y="442" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Cálculo de domínio</text>

        <line x1="672" y1="440" x2="700" y2="440" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    </div>
  </div>
