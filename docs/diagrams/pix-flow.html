<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Bank · Fluxo Pix</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1120px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }
    p.lede { font-size: 0.85rem; color: var(--color-muted); max-width: 66ch; margin-bottom: 1.5rem; line-height: 1.5; }
    .diagram { border: 1px solid rgba(45,49,66,0.10); border-radius: 8px; padding: 1rem; background: var(--color-paper); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Aurora Bank</p>
    <h1>Pix: a chave só sai do banco depois do débito</h1>
    <p class="lede">Envio por chave com validação de saldo e limite antes de qualquer escrita. Se a chave não existir ou o valor passar de R$ 20.000,00, a transação é recusada e nada é persistido.</p>

    <div class="diagram">
    <svg viewBox="20 60 1040 380" preserveAspectRatio="xMinYMin meet" style="width:100%; height:auto; aspect-ratio: 1040 / 380;" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pix-title pix-desc">
      <title id="pix-title">Sequência de uma transferência Pix por chave</title>
      <desc id="pix-desc">O app pede a transferência, a API valida a chave e o limite, debita a conta de origem, credita a de destino e devolve o comprovante.</desc>
      <defs>
        <marker id="msg" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="msg-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        <marker id="ret" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6580"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Actors -->
      <rect x="48" y="76" width="128" height="40" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
      <text x="112" y="94" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">App do cliente</text>
      <text x="112" y="108" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">expo-router</text>

      <rect x="316" y="76" width="128" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="380" y="94" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API Pix</text>
      <text x="380" y="108" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">route handler</text>

      <rect x="584" y="76" width="128" height="40" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="648" y="94" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Regras Pix</text>
      <text x="648" y="108" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">@aurora/shared</text>

      <rect x="852" y="76" width="128" height="40" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="916" y="94" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ledger</text>
      <text x="916" y="108" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">contas · extrato</text>

      <!-- Lifelines -->
      <line x1="112" y1="116" x2="112" y2="424" stroke="rgba(45,49,66,0.22)" stroke-width="0.9" stroke-dasharray="4,4"/>
      <line x1="380" y1="116" x2="380" y2="424" stroke="rgba(45,49,66,0.22)" stroke-width="0.9" stroke-dasharray="4,4"/>
      <line x1="648" y1="116" x2="648" y2="424" stroke="rgba(45,49,66,0.22)" stroke-width="0.9" stroke-dasharray="4,4"/>
      <line x1="916" y1="116" x2="916" y2="424" stroke="rgba(45,49,66,0.22)" stroke-width="0.9" stroke-dasharray="4,4"/>

      <!-- 01 -->
      <line x1="112" y1="148" x2="372" y2="148" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#msg)"/>
      <text x="118" y="143" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">1 · POST /api/pix/transfers</text>
      <text x="118" y="160" fill="#5a6580" font-size="7.5" font-family="'Geist Mono', monospace">chave · valor · conta</text>
      <rect x="376" y="128" width="8" height="40" rx="2" fill="rgba(45,49,66,0.14)"/>

      <!-- 02 -->
      <line x1="380" y1="196" x2="640" y2="196" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#msg)"/>
      <text x="386" y="191" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">2 · normalizar chave</text>
      <text x="386" y="208" fill="#5a6580" font-size="7.5" font-family="'Geist Mono', monospace">pixKeySchema</text>
      <rect x="644" y="176" width="8" height="40" rx="2" fill="rgba(45,49,66,0.14)"/>

      <!-- 03 return -->
      <line x1="640" y1="244" x2="388" y2="244" stroke="#5a6580" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ret)"/>
      <text x="392" y="239" fill="#5a6580" font-size="8.5" font-family="'Geist Mono', monospace">3 · chave válida · conta destino</text>

      <!-- 04 -->
      <line x1="380" y1="284" x2="908" y2="284" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#msg)"/>
      <text x="386" y="279" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">4 · consultar saldo e limite</text>
      <text x="386" y="296" fill="#5a6580" font-size="7.5" font-family="'Geist Mono', monospace">limite diário R$ 20.000,00</text>
      <rect x="912" y="264" width="8" height="40" rx="2" fill="rgba(45,49,66,0.14)"/>

      <!-- 05 -->
      <line x1="908" y1="332" x2="388" y2="332" stroke="#5a6580" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ret)"/>
      <text x="392" y="327" fill="#5a6580" font-size="8.5" font-family="'Geist Mono', monospace">5 · saldo suficiente · 4.250,00</text>

      <!-- 06 focal -->
      <line x1="380" y1="372" x2="908" y2="372" stroke="#bf4520" stroke-width="1.4" marker-end="url(#msg-accent)"/>
      <text x="386" y="367" fill="#bf4520" font-size="8.5" font-family="'Geist Mono', monospace">6 · debitar · creditar · gravar extrato</text>
      <text x="386" y="384" fill="#5a6580" font-size="7.5" font-family="'Geist Mono', monospace">atômico: ou tudo, ou nada</text>

      <!-- 07 return -->
      <line x1="380" y1="412" x2="120" y2="412" stroke="#5a6580" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ret)"/>
      <text x="160" y="407" fill="#5a6580" font-size="8.5" font-family="'Geist Mono', monospace">7 · 201 · comprovante · id da transação</text>
    </svg>
    </div>
  </div>
</body>
</html>
